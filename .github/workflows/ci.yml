name: Cross-language checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 python/train_model.py --output models/generated_model.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/model-runtime --model models/generated_model.txt --repeat 1000
      - run: python3 python/reference_inference.py --model models/generated_model.txt --input data/sample_features.csv --compare results/predictions.csv
